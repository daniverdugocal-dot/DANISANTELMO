<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cronograma del plan de acción</title>
<style>
  @page { size: A4 landscape; margin: 12mm; }
  body { margin:0; padding:0; font-family:"Calibri","Carlito","Liberation Sans",sans-serif; background:#fff; }
  #wrap { width: 900px; }
  svg { width:100%; height:auto; display:block; }
</style>
</head>
<body>
<div id="wrap">
<svg viewBox="0 0 900 268" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Cronograma del plan de acción de PCC Fresh, de abril de 2026 a junio de 2027, en cuatro fases">

  <!-- gridlines mensuales -->
  <g stroke="#E3E7EA" stroke-width="1">
    <line x1="260"   y1="8" x2="260"   y2="228"/>
    <line x1="301.3" y1="8" x2="301.3" y2="228"/>
    <line x1="342.7" y1="8" x2="342.7" y2="228"/>
    <line x1="384"   y1="8" x2="384"   y2="228"/>
    <line x1="425.3" y1="8" x2="425.3" y2="228"/>
    <line x1="466.7" y1="8" x2="466.7" y2="228"/>
    <line x1="508"   y1="8" x2="508"   y2="228"/>
    <line x1="549.3" y1="8" x2="549.3" y2="228"/>
    <line x1="590.7" y1="8" x2="590.7" y2="228"/>
    <line x1="632"   y1="8" x2="632"   y2="228"/>
    <line x1="673.3" y1="8" x2="673.3" y2="228"/>
    <line x1="714.7" y1="8" x2="714.7" y2="228"/>
    <line x1="756"   y1="8" x2="756"   y2="228"/>
    <line x1="797.3" y1="8" x2="797.3" y2="228"/>
    <line x1="838.7" y1="8" x2="838.7" y2="228"/>
    <line x1="880"   y1="8" x2="880"   y2="228"/>
  </g>

  <!-- barras -->
  <rect x="260"   y="20"  width="82.7"  height="34" rx="4" fill="#86b6ef"/>
  <rect x="342.7" y="76"  width="82.6"  height="34" rx="4" fill="#5598e7"/>
  <rect x="425.3" y="132" width="206.7" height="34" rx="4" fill="#2a78d6"/>
  <rect x="632"   y="188" width="248"   height="34" rx="4" fill="#184f95"/>

  <!-- etiquetas de fase -->
  <g font-size="14.5" fill="#0b0b0b" text-anchor="end">
    <text x="244" y="42">Fase 1. Preparar y cerrar el lanzamiento</text>
    <text x="244" y="98">Fase 2. Hacer visible CERO™</text>
    <text x="244" y="154">Fase 3. Probar, medir y ajustar</text>
    <text x="244" y="210">Fase 4. Convertir el piloto en estándar</text>
  </g>

  <!-- etiquetas de periodo -->
  <g font-size="13.5" font-weight="700">
    <text x="354" y="42" fill="#0b0b0b">Abr 26 – May 26</text>
    <text x="437" y="98" fill="#0b0b0b">Jun 26 – Jul 26</text>
    <text x="528.7" y="154" fill="#ffffff" text-anchor="middle">Ago 26 – Dic 26</text>
    <text x="756"   y="210" fill="#ffffff" text-anchor="middle">Ene 27 – Jun 27</text>
  </g>

  <!-- eje de meses -->
  <line x1="260" y1="228" x2="880" y2="228" stroke="#C7CDD2" stroke-width="1"/>
  <g font-size="11.5" fill="#5c6368" text-anchor="middle">
    <text x="280.7" y="246">Abr 26</text>
    <text x="322"   y="246">May 26</text>
    <text x="363.3" y="246">Jun 26</text>
    <text x="404.7" y="246">Jul 26</text>
    <text x="446"   y="246">Ago 26</text>
    <text x="487.3" y="246">Sep 26</text>
    <text x="528.7" y="246">Oct 26</text>
    <text x="570"   y="246">Nov 26</text>
    <text x="611.3" y="246">Dic 26</text>
    <text x="652.7" y="246">Ene 27</text>
    <text x="694"   y="246">Feb 27</text>
    <text x="735.3" y="246">Mar 27</text>
    <text x="776.7" y="246">Abr 27</text>
    <text x="818"   y="246">May 27</text>
    <text x="859.3" y="246">Jun 27</text>
  </g>

  <!-- hito de las ferias de Monterrey -->
  <line x1="404.7" y1="8" x2="404.7" y2="228" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="410" y="18" font-size="11" fill="#B03A2E" font-weight="700">Ferias de Monterrey</text>

</svg>
</div>
</body>
</html>
